services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: service_template
      POSTGRES_USER: service_template
      POSTGRES_PASSWORD: service_template
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_template -d service_template"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
